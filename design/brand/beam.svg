      <stop offset="0" stop-color="#30363D"/><stop offset="1" stop-color="#16191C"/>
    </linearGradient>
    <radialGradient id="glow" cx="317" cy="256" r="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A8CF8" stop-opacity="0.32"/><stop offset="1" stop-color="#9A8CF8" stop-opacity="0"/>
